<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FIMAS SkladNote – požadavky zákazníků</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f3d23;--ink2:#2b5230;--ink3:#16301a;--brand:#4f8a52;--brandlt:#e9f2e6;--accent:#ecb736;--steel:#5b6470;--paper:#f5f6f2;--line:#dfe4da;--red:#c0392b;
  --head:"Barlow Condensed","Arial Narrow",sans-serif;--body:Inter,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--paper);color:var(--ink3);min-height:100vh}
header{background:var(--ink3);color:#fff;border-bottom:5px solid var(--accent);display:flex;align-items:center;gap:20px;padding:14px 28px}
header h1{font:800 34px var(--head);text-transform:uppercase;letter-spacing:.03em;flex:1}
header h1 span{color:var(--accent)}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:10px;padding:12px 22px;font:700 20px var(--head);text-transform:uppercase;letter-spacing:.05em;background:var(--ink);color:#fff}
.btn.y{background:var(--accent);color:var(--ink3)}
.btn.l{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
nav{display:flex;gap:10px}
nav .btn.on{background:var(--accent);color:var(--ink3)}
main{max-width:1280px;margin:0 auto;padding:28px}
.card{background:#fff;border-radius:14px;padding:28px;box-shadow:0 6px 18px rgba(31,61,35,.08)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px}
.full{grid-column:1/-1}
label{display:block;font:700 18px var(--head);text-transform:uppercase;letter-spacing:.05em;color:var(--steel);margin-bottom:6px}
label i{font-style:normal;color:var(--red)}
input,textarea,select{width:100%;font:500 20px var(--body);padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink3)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand)}
textarea{min-height:170px;resize:vertical}
.row{display:flex;gap:14px;align-items:center;margin-top:20px}
.msg{padding:14px 18px;border-radius:10px;font-size:19px;margin-top:18px;display:none}
.msg.ok{display:block;background:var(--brandlt);border-left:6px solid var(--brand)}
.msg.err{display:block;background:#fbe9e7;border-left:6px solid var(--red)}
#login{max-width:520px;margin:60px auto;text-align:center}
#login h2{font:800 38px var(--head);text-transform:uppercase;margin-bottom:6px}
#login p{color:var(--steel);margin-bottom:18px}
.filters{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.filters input{flex:1;min-width:260px}
.filters select{width:200px}
.item{background:#fff;border-radius:12px;padding:18px 22px;margin-bottom:12px;border-left:8px solid var(--line);box-shadow:0 3px 10px rgba(31,61,35,.06)}
.item.s-Nový{border-left-color:var(--red)}
.item.s-Evidováno{border-left-color:var(--accent)}
.item.s-Vyřízeno{border-left-color:var(--brand);opacity:.75}
.ih{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.ih b{font:800 24px var(--head)}
.ih .no{font:700 18px var(--head);color:var(--steel)}
.ih .dt{color:var(--steel);font-size:15px;margin-left:auto}
.chip{display:inline-block;border-radius:99px;padding:3px 12px;font:700 15px var(--head);text-transform:uppercase;letter-spacing:.05em}
.chip.Nový{background:#fbe9e7;color:var(--red)}
.chip.Evidováno{background:#fdf3d7;color:#8a6500}
.chip.Vyřízeno{background:var(--brandlt);color:var(--ink)}
.meta{color:var(--steel);font-size:16px;margin:6px 0 8px}
.meta a{color:var(--ink)}
.req{white-space:pre-wrap;font-size:18px;line-height:1.45}
.note{margin-top:8px;font-size:16px;color:var(--ink2);background:var(--paper);padding:8px 12px;border-radius:8px}
.adm{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.adm .btn{font-size:16px;padding:8px 14px}
.adm input{flex:1;min-width:200px;font-size:16px;padding:8px 12px}
.empty{color:var(--steel);text-align:center;padding:40px;font-size:19px}
.hidden{display:none!important}
.who{font-size:15px;color:#cfdccd}
</style>
</head>
<body>
<header>
  <h1>Sklad<span>Note</span> <small style="font:600 18px var(--body);text-transform:none;letter-spacing:0;color:#cfdccd">požadavky zákazníků</small></h1>
  <nav id="nav" class="hidden">
    <button class="btn on" data-v="novy">Nový požadavek</button>
    <button class="btn" data-v="seznam">Přehled</button>
  </nav>
  <span class="who" id="who"></span>
  <button class="btn l" id="zpet">◀ Zpět</button>
</header>

<main>
  <!-- PŘIHLÁŠENÍ -->
  <section id="login" class="card">
    <h2>SkladNote je pod heslem</h2>
    <p>Zadejte heslo skladu</p>
    <input type="password" id="heslo" autocomplete="off" placeholder="Heslo">
    <div class="row" style="justify-content:center"><button class="btn y" id="prihlasit">Pokračovat</button></div>
    <div class="msg" id="loginMsg"></div>
  </section>

  <!-- NOVÝ POŽADAVEK -->
  <section id="v-novy" class="card hidden">
    <form id="form" class="grid" autocomplete="off">
      <div><label>Firma</label><input name="firma" maxlength="200"></div>
      <div><label>IČO</label><input name="ico" inputmode="numeric" maxlength="12" placeholder="8 číslic"></div>
      <div><label>Jméno zákazníka</label><input name="jmeno" maxlength="200"></div>
      <div><label>Telefon</label><input name="telefon" inputmode="tel" maxlength="40" placeholder="+420 …"></div>
      <div><label>E-mail zákazníka</label><input name="email" type="email" maxlength="200"></div>
      <div><label>Zapsal</label><input name="zapsal" maxlength="60" placeholder="Vaše jméno"></div>
      <div class="full"><label>Požadavek <i>*</i></label><textarea name="pozadavek" maxlength="2000" placeholder="Co zákazník potřebuje – díl, číslo, počet kusů, stroj…" required></textarea></div>
    </form>
    <div class="row">
      <button class="btn y" id="odeslat">Uložit a odeslat</button>
      <button class="btn l" id="vymazat">Vymazat</button>
    </div>
    <div class="msg" id="formMsg"></div>
  </section>

  <!-- PŘEHLED -->
  <section id="v-seznam" class="hidden">
    <div class="filters">
      <input id="hledat" placeholder="Hledat: číslo, firma, jméno, IČO, telefon, text…">
      <select id="filtr"><option value="">Všechny stavy</option><option>Nový</option><option>Evidováno</option><option>Vyřízeno</option></select>
      <button class="btn l" id="obnovit">Obnovit</button>
    </div>
    <div id="list"><div class="empty">Načítám…</div></div>
  </section>
</main>

<script>
/* ===== NASTAVENÍ: URL webové aplikace Google Apps Script ===== */
const API = "";   // sem patří adresa „…/exec“ z nasazení skriptu
/* ============================================================== */

const $ = s => document.querySelector(s);
let heslo = "", spravce = false, polozky = [];
const store = { get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}} };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(akce, extra = {}) {
  if (!API) throw new Error("SkladNote zatím není propojený s Google Tabulkou.");
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ akce, heslo, ...extra }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.chyba === "heslo" ? "Špatné heslo." : j.chyba);
  return j;
}
function show(el, text, ok) { el.textContent = text; el.className = "msg " + (ok ? "ok" : "err"); }

/* přihlášení */
async function login(h) {
  heslo = h;
  try {
    const j = await api("prihlasit"); spravce = j.spravce;
    store.set("fimasZapis", h);
    $("#login").classList.add("hidden"); $("#nav").classList.remove("hidden");
    $("#who").textContent = spravce ? "Správce" : "";
    view("novy");
  } catch (e) { heslo = ""; show($("#loginMsg"), e.message, false); }
}
$("#prihlasit").onclick = () => login($("#heslo").value);
$("#heslo").onkeydown = e => { if (e.key === "Enter") login($("#heslo").value); };
$("#zpet").onclick = () => history.length > 1 ? history.back() : (location.href = "./");

/* přepínání */
function view(v) {
  $("#v-novy").classList.toggle("hidden", v !== "novy");
  $("#v-seznam").classList.toggle("hidden", v !== "seznam");
  document.querySelectorAll("#nav .btn").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  if (v === "seznam") nacti();
}
document.querySelectorAll("#nav .btn").forEach(b => b.onclick = () => view(b.dataset.v));

/* nový požadavek */
const form = $("#form");
try { form.zapsal.value = localStorage.getItem("fimasZapsal") || ""; } catch (e) {}
$("#vymazat").onclick = () => { const z = form.zapsal.value; form.reset(); form.zapsal.value = z; $("#formMsg").className = "msg"; };
$("#odeslat").onclick = async () => {
  const d = Object.fromEntries(new FormData(form));
  if (!d.pozadavek.trim()) return show($("#formMsg"), "Napište požadavek zákazníka.", false);
  if (!d.firma.trim() && !d.jmeno.trim()) return show($("#formMsg"), "Vyplňte firmu nebo jméno zákazníka.", false);
  if (!d.telefon.trim() && !d.email.trim()) return show($("#formMsg"), "Vyplňte telefon nebo e-mail, ať se zákazníkovi můžeme ozvat.", false);
  if (d.ico.trim() && !/^\d{8}$/.test(d.ico.replace(/\s/g, ""))) return show($("#formMsg"), "IČO má 8 číslic.", false);
  if (d.email.trim() && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email.trim())) return show($("#formMsg"), "E-mail nevypadá správně.", false);
  d.ico = d.ico.replace(/\s/g, "");
  try { localStorage.setItem("fimasZapsal", d.zapsal); } catch (e) {}
  $("#odeslat").disabled = true;
  try {
    const j = await api("novy", { data: d });
    show($("#formMsg"), `Uloženo a odesláno na info@fimas.cz. Číslo požadavku: ${j.cislo}`, true);
    const z = d.zapsal; form.reset(); form.zapsal.value = z;
  } catch (e) { show($("#formMsg"), "Neodesláno: " + e.message, false); }
  $("#odeslat").disabled = false;
};

/* přehled */
async function nacti() {
  $("#list").innerHTML = '<div class="empty">Načítám…</div>';
  try { polozky = (await api("seznam")).polozky; vykresli(); }
  catch (e) { $("#list").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function vykresli() {
  const q = $("#hledat").value.trim().toLowerCase(), f = $("#filtr").value;
  const v = polozky.filter(p => (!f || p.stav === f) &&
    (!q || [p.cislo, p.firma, p.jmeno, p.ico, p.telefon, p.email, p.pozadavek, p.zapsal, p.poznamka].join(" ").toLowerCase().includes(q)));
  if (!v.length) { $("#list").innerHTML = '<div class="empty">Nic nenalezeno.</div>'; return; }
  $("#list").innerHTML = v.map(p => `<div class="item s-${esc(p.stav)}">
    <div class="ih"><span class="no">${esc(p.cislo)}</span><b>${esc(p.firma || p.jmeno || "Bez jména")}</b><span class="chip ${esc(p.stav)}">${esc(p.stav)}</span>
      <span class="dt">${esc(p.zapsano)}${p.zapsal ? " · zapsal " + esc(p.zapsal) : ""}</span></div>
    <div class="meta">${[p.firma && p.jmeno ? esc(p.jmeno) : "", p.ico ? "IČO " + esc(p.ico) : "", p.telefon ? esc(p.telefon) : "", p.email ? esc(p.email) : ""].filter(Boolean).join(" · ")}</div>
    <div class="req">${esc(p.pozadavek)}</div>
    ${p.poznamka ? `<div class="note">Poznámka: ${esc(p.poznamka)}</div>` : ""}
    ${spravce ? `<div class="adm" data-c="${esc(p.cislo)}">
      <input placeholder="Poznámka (nepovinné)" value="${esc(p.poznamka)}">
      <button class="btn y" data-s="Evidováno">Eviduji</button>
      <button class="btn" data-s="Vyřízeno">Vyřízeno</button>
      <button class="btn l" data-s="Nový">Vrátit na Nový</button></div>` : ""}
  </div>`).join("");
}
$("#hledat").oninput = vykresli; $("#filtr").onchange = vykresli; $("#obnovit").onclick = nacti;
$("#list").onclick = async e => {
  const b = e.target.closest("button[data-s]"); if (!b) return;
  const box = b.closest(".adm"); b.disabled = true;
  try { await api("stav", { cislo: box.dataset.c, stav: b.dataset.s, poznamka: box.querySelector("input").value }); await nacti(); }
  catch (err) { alert(err.message); b.disabled = false; }
};

/* auto-přihlášení v rámci relace */
const ulozene = store.get("fimasZapis");
if (ulozene) login(ulozene); else $("#heslo").focus();
if (!API) show($("#loginMsg"), "SkladNote zatím není propojený s Google Tabulkou (chybí adresa skriptu).", false);
</script>
</body>
</html>
